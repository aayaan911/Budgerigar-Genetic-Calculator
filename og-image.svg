  <!-- Pure black base -->
  <rect width="1200" height="630" fill="#000000"/>
  <!-- Radial green glow centered on right (behind decorative bird) -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Right-side decorative giant parrot watermark (low opacity, wireframe style) -->
  <g opacity="0.32" transform="translate(810 90) scale(0.85)">
    <use href="#kinbird-logo" width="514" height="543"/>
  </g>

  <!-- DNA helix swoosh decoration (bottom-right) -->
  <g stroke="url(#dnaGrad)" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 760 520 Q 880 480 1000 540 T 1200 600"/>
    <path d="M 760 540 Q 880 600 1000 520 T 1200 580"/>
    <g stroke="#4ca154" stroke-width="1.2" opacity="0.55">
      <line x1="780" y1="510" x2="780" y2="555"/>
      <line x1="820" y1="495" x2="820" y2="565"/>
      <line x1="860" y1="500" x2="860" y2="568"/>
      <line x1="900" y1="510" x2="900" y2="560"/>
      <line x1="940" y1="525" x2="940" y2="548"/>
      <line x1="980" y1="510" x2="980" y2="556"/>
      <line x1="1020" y1="500" x2="1020" y2="566"/>
      <line x1="1060" y1="510" x2="1060" y2="568"/>
      <line x1="1100" y1="525" x2="1100" y2="565"/>
      <line x1="1140" y1="540" x2="1140" y2="585"/>
    </g>
  </g>
  <!-- Particle dots (bottom-right grid) -->
  <g fill="#4ca154" opacity="0.42">
    <circle cx="980" cy="600" r="1.4"/><circle cx="1010" cy="600" r="1.4"/><circle cx="1040" cy="600" r="1.4"/><circle cx="1070" cy="600" r="1.4"/><circle cx="1100" cy="600" r="1.4"/><circle cx="1130" cy="600" r="1.4"/><circle cx="1160" cy="600" r="1.4"/>
    <circle cx="980" cy="615" r="1.4"/><circle cx="1010" cy="615" r="1.4"/><circle cx="1040" cy="615" r="1.4"/><circle cx="1070" cy="615" r="1.4"/><circle cx="1100" cy="615" r="1.4"/><circle cx="1130" cy="615" r="1.4"/><circle cx="1160" cy="615" r="1.4"/>
    <circle cx="1010" cy="585" r="1.4"/><circle cx="1040" cy="585" r="1.4"/><circle cx="1070" cy="585" r="1.4"/><circle cx="1100" cy="585" r="1.4"/><circle cx="1130" cy="585" r="1.4"/><circle cx="1160" cy="585" r="1.4"/>
    <circle cx="1040" cy="570" r="1.4"/><circle cx="1070" cy="570" r="1.4"/><circle cx="1100" cy="570" r="1.4"/><circle cx="1130" cy="570" r="1.4"/><circle cx="1160" cy="570" r="1.4"/>
  </g>

  <!-- ========== HEADER: logo + brand text ========== -->
  <g transform="translate(64 70)">
    <use href="#kinbird-logo" width="58" height="61"/>
    <!-- Vertical divider -->
    <line x1="80" y1="6" x2="80" y2="56" stroke="#2b2b2b" stroke-width="1.4"/>
    <!-- KinBird Aviary -->
    <text x="98" y="28" font-family="DM Sans, sans-serif" font-weight="500" font-size="24" fill="#ffffff" letter-spacing="-0.2">KinBird Aviary</text>
    <!-- Domain -->
    <text x="98" y="52" font-family="DM Sans, sans-serif" font-weight="500" font-size="16" fill="#4ca154" letter-spacing="0">budgerigargenetics.com</text>
  </g>

  <!-- ========== MAIN HEADING ========== -->
  <!-- "Budgerigar" (white) -->
  <text x="64" y="290" font-family="DM Sans, sans-serif" font-weight="800" font-size="115" fill="#ffffff" letter-spacing="-2.5">Budgerigar</text>
  <!-- "Genetics Calculator" (green) -->
  <text x="64" y="405" font-family="DM Sans, sans-serif" font-weight="800" font-size="115" fill="#4ca154" letter-spacing="-2.5">Genetics Calculator</text>

  <!-- ========== SUBHEADING ========== -->
  <text x="64" y="465" font-family="DM Sans, sans-serif" font-weight="500" font-size="26" fill="#e6e6e6" letter-spacing="-0.4">Predict offspring mutations instantly</text>

  <!-- ========== MUTATION CHIPS ========== -->
  <g font-family="DM Sans, sans-serif" font-weight="500" font-size="22" fill="#a8a8a8" letter-spacing="-0.3">
    <text x="64" y="510">
      <tspan>Opaline</tspan>
      <tspan fill="#4ca154" dx="14">·</tspan>
      <tspan dx="14">Cinnamon</tspan>
      <tspan fill="#4ca154" dx="14">·</tspan>
      <tspan dx="14">Spangle</tspan>
      <tspan fill="#4ca154" dx="14">·</tspan>
      <tspan dx="14">Pied</tspan>
      <tspan fill="#4ca154" dx="14">·</tspan>
      <tspan dx="14">Dark Factor</tspan>
      <tspan fill="#4ca154" dx="14">·</tspan>
      <tspan dx="14">Yellow Face and more</tspan>
    </text>
  </g>

  <!-- ========== 3 PILL BADGES (bottom) ========== -->
  <!-- Pill 1: Free -->
  <g transform="translate(64 555)">
    <rect width="130" height="50" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.4"/>
    <!-- check circle icon -->
    <circle cx="26" cy="25" r="11" fill="none" stroke="#4ca154" stroke-width="1.8"/>
    <polyline points="21,25 25,29 32,21" fill="none" stroke="#4ca154" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="32" font-family="DM Sans, sans-serif" font-weight="500" font-size="18" fill="#ffffff">Free</text>
  </g>

  <!-- Pill 2: No Account Needed -->
  <g transform="translate(210 555)">
    <rect width="248" height="50" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.4"/>
    <!-- person icon -->
    <circle cx="26" cy="22" r="5.5" fill="none" stroke="#4ca154" stroke-width="1.8"/>
    <path d="M 18 36 Q 26 28 34 36" fill="none" stroke="#4ca154" stroke-width="1.8" stroke-linecap="round"/>
    <text x="48" y="32" font-family="DM Sans, sans-serif" font-weight="500" font-size="18" fill="#ffffff">No Account Needed</text>
  </g>

  <!-- Pill 3: All Mutations Supported -->
  <g transform="translate(474 555)">
    <rect width="280" height="50" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.4"/>
    <!-- DNA helix icon -->
    <g stroke="#4ca154" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M 19 14 Q 26 25 19 36"/>
      <path d="M 33 14 Q 26 25 33 36"/>
      <line x1="20" y1="18" x2="32" y2="18"/>
      <line x1="22" y1="25" x2="30" y2="25"/>
      <line x1="20" y1="32" x2="32" y2="32"/>
    </g>
    <text x="48" y="32" font-family="DM Sans, sans-serif" font-weight="500" font-size="18" fill="#ffffff">All Mutations Supported</text>
  </g>

</svg>
