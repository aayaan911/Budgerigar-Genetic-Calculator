[build]
  publish = "."

# ─── Edge Functions ──────────────────────────────────────────
# Server-side render budgerigar pairing results so AI crawlers
# (GPTBot, ClaudeBot, PerplexityBot) and Googlebot see actual
# offspring predictions when URL contains pairing params.
[[edge_functions]]
  function = "genetics-ssr"
  path = "/"

[[edge_functions]]
  function = "genetics-ssr"
  path = "/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Clean URL for privacy page
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Custom domain redirect — DISABLED until budgerigargenetics.com (or similar) is purchased & DNS-pointed.
# When the custom domain is ready, uncomment and update the from/to URLs.
